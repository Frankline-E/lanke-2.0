name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # Checkout repository
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v5

      # --------------------------------------------------
      # Setup pnpm FIRST
      # --------------------------------------------------
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.23.0
          run_install: false

      # --------------------------------------------------
      # Setup Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # --------------------------------------------------
      # Verify versions
      # --------------------------------------------------
      - name: Check versions
        run: |
          echo "Node.js:"
          node --version

          echo "pnpm:"
          pnpm --version

      # --------------------------------------------------
      # Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --------------------------------------------------
      # Lint
      # --------------------------------------------------
      - name: Lint
        run: pnpm lint

      # --------------------------------------------------
      # Typecheck
      # --------------------------------------------------
      - name: Typecheck
        run: pnpm typecheck

      # --------------------------------------------------
      # Build
      # --------------------------------------------------
      - name: Build
        run: pnpm build
